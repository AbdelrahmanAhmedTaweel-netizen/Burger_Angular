<section class="py-5">
  <div class="container">
    <h2 class="text-light text-center mb-5 fw-bolder fs-1">Book Now</h2>
    <form>
      <div class="mb-3">
        <label for="name" class="form-label text-light">Name :</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="mb-3">
        <label for="People" class="form-label text-light">How Many People :</label>
        <input type="number" class="form-control" id="People" required>
      </div>
      <div class="mb-3">
        <label for="date" class="form-label text-light">Date :</label>
        <input type="datetime-local" class="form-control" id="date" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label text-light">Message</label>
        <textarea class="form-control" id="message" rows="3"></textarea>
      </div>
      <button type="submit" class="fw-bolder fs-5">Book</button>
    </form>
  </div>
</section>
